# =============================================================================
# Pixel & Ping Showcase — GitHub Pages deployment
# =============================================================================
# Builds the Vite project on every push to main / master and deploys the static
# `dist/` folder to GitHub Pages. No external services, no paid hosting.
#
# SETUP (one-time, in your repo):
#   1. Push this workflow to your repository under .github/workflows/deploy.yml
#   2. In your repo: Settings → Pages → "Build and deployment" → Source:
#      select **GitHub Actions** (NOT "Deploy from a branch")
#   3. On the next push, this workflow runs and your site appears at
#      https://<your-username>.github.io/<repo-name>/
#
# If you change the repo name, also update `VITE_BASE_PATH` in vite.config.ts
# (or set the `repoName` constant at the top of that file).
# =============================================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite)
        # VITE_BASE_PATH is auto-derived from vite.config.ts, but if you want
        # to override it for a custom repo name, uncomment and edit:
        # env:
        #   VITE_BASE_PATH: /your-repo-name/
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
